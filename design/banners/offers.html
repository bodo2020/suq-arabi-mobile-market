<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { background: radial-gradient(120% 120% at 100% 0%, #ffd766 0%, #FFC120 45%, #f2ac00 100%); }
.blob1 { width: 520px; height: 520px; left: -140px; top: -160px; background: rgba(255,255,255,.22); }
.blob2 { width: 300px; height: 300px; right: 380px; bottom: -150px; background: rgba(0,89,49,.08); }
.text { position: absolute; right: 70px; top: 92px; width: 600px; }
.pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; background: #005931; padding: 12px 26px; font-size: 32px; font-weight: 700; color: #fff; box-shadow: 0 10px 24px rgba(0,63,35,.25); }
.pill .wm { font-size: 34px; }
h1 { margin-top: 34px; color: #005931; font-size: 132px; font-weight: 900; line-height: 1.02; letter-spacing: -2px; }
h2 { color: #005931; font-size: 92px; font-weight: 900; line-height: 1.1; }
h2 span { display: inline-block; background: #005931; color: #FFC120; border-radius: 26px; padding: 0 26px 6px; transform: rotate(-3deg); margin-right: 8px; }
p { margin-top: 26px; color: #4a3a00; font-size: 36px; font-weight: 700; }
.btn { position: absolute; right: 70px; bottom: 74px; background: #005931; color: #fff; box-shadow: 0 14px 30px rgba(0,63,35,.3); }
.btn i { color: #FFC120; font-style: normal; }
.card { position: absolute; width: 230px; height: 268px; border-radius: 34px; background: #fff; box-shadow: 0 22px 44px rgba(90,60,0,.22); padding: 20px; display: flex; align-items: center; justify-content: center; }
.card img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tag { position: absolute; top: -18px; left: -14px; background: #005931; color: #FFC120; font-size: 34px; font-weight: 900; border-radius: 18px 18px 18px 6px; padding: 6px 16px; box-shadow: 0 8px 18px rgba(0,63,35,.3); direction: rtl; }
.c1 { left: 330px; top: 70px; transform: rotate(-6deg); }
.c2 { left: 80px; top: 120px; transform: rotate(5deg); }
.c3 { left: 300px; top: 420px; transform: rotate(4deg); }
.c4 { left: 60px; top: 470px; transform: rotate(-5deg); }
</style></head>
<body>

  <div class="card c2"><img src="https://qzvpayjaadbmpayeglon.supabase.co/storage/v1/object/public/products/categories/c3xrmrbbvlf.jpg"><span class="tag">-٢٠٪</span></div>
  <div class="card c3"><img src="https://qzvpayjaadbmpayeglon.supabase.co/storage/v1/object/public/products/categories/7jud9kpu30r.jpg"><span class="tag">-٢٥٪</span></div>
  <div class="card c4"><img src="https://qzvpayjaadbmpayeglon.supabase.co/storage/v1/object/public/products/categories/4n2fw0w6t1o.jpg"><span class="tag">-٢٣٪</span></div>
