    <meta name="twitter:site" content="@elmadawymarket" />

    <link rel="icon" href="/brand/super-marko-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/brand/super-marko-icon.png">

    <style>
      #brand-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; padding: 16px; background: #005931; }
      #brand-splash img { display: block; width: min(100%, 520px); height: auto; object-fit: contain; animation: brand-enter .8s cubic-bezier(.18,.8,.25,1) both; }
      #brand-splash.is-exiting { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .22s ease, visibility .22s; }
      @keyframes brand-enter { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @media (prefers-reduced-motion: reduce) { #brand-splash img { animation: none; } #brand-splash.is-exiting { transition: none; } }
    </style>

    <!-- Immediately hide Lovable badge as early as possible -->
    <style>
      a[href*="lovable.dev"],
      a[href*="lovable.app"],
      [class*="lovable"],
      [class*="lovable-badge"],
      [id*="lovable"],
      [data-lovable],
      [aria-label*="lovable"],
      [aria-label*="Lovable"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        position: absolute !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        margin: -1px !important;
        padding: 0 !important;
        border: 0 !important;
      }
    </style>

    <!-- Execute badge hiding function immediately -->
    <script>
      (function() {
        function removeBadges() {
          const selectors = [
            'a[href*="lovable.dev"]',
            'a[href*="lovable.app"]',
            '[class*="lovable-badge"]',
            '[class*="lovable"]',
            '[id*="lovable"]',
          ];

          selectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(el => {
              if (el && el.parentNode) {
                el.parentNode.removeChild(el);
              }
            });
          });
        }

        removeBadges();
        document.addEventListener('DOMContentLoaded', removeBadges);

        if (typeof MutationObserver !== 'undefined') {
          const observer = new MutationObserver(removeBadges);

          const startObserving = function() {
            if (document.body) {
              observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style', 'id']
              });
            } else {
              setTimeout(startObserving, 10);
            }
          };

          startObserving();
        }
      })();
    </script>
  </head>

  <body>
    <div id="brand-splash" role="status" aria-label="جاري فتح ســــــوبـرمــــاركو">
