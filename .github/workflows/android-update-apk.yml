name: Super Marko Customer Update APK
on:
  push:
    branches: [build/update-compatible-customer-android]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/firebase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-update-apk.yml'
  pull_request:
    branches: [feat/restaurant-cart-nonpayable-previews]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marko-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION_CODE: '1300100'
      APP_VERSION_NAME: '1.3.100-super-marko'
      FIREBASE_CLIENT_FALLBACK: config/firebase/google-services.customer.json
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci --no-audit --no-fund
      - name: Detect native push config
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] || [ -f "$FIREBASE_CLIENT_FALLBACK" ]; then
            echo "VITE_NATIVE_PUSH_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "VITE_NATIVE_PUSH_CONFIGURED=false" >> "$GITHUB_ENV"
          fi
      - name: Typecheck and bundle
        run: |
          npx tsc --noEmit
          npm run build
      - name: Generate native Android project
        run: npx cap add android
      - name: Keep existing Firebase application configuration
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "$FIREBASE_CLIENT_FALLBACK" ]; then
            cp "$FIREBASE_CLIENT_FALLBACK" android/app/google-services.json
          fi
      - name: Set higher Android version and preserve package
        run: |
          npx cap sync android
          node scripts/set-android-version.mjs
          node scripts/prepare-android.mjs
          node scripts/prepare-android-back.mjs
          grep -q 'com.elmadawy.market.customer' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+1300100' android/app/build.gradle
      - name: Assemble test/debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK identity and debug signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "^package:"
          "$APK_SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug test APK (NOT guaranteed update-compatible)
        uses: actions/upload-artifact@v4
        with:
          name: super-marko-1300100-debug-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
        continue-on-error: true
      - name: Ensure complete existing release credentials
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_STORE_PASSWORD" ] || {
            echo "::error::Release signing secrets incomplete; cannot create install-over APK"
            exit 1
          }
      - name: Assemble release APK
        if: env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign with the EXISTING Android release key
        if: env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != ''
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marko.keystore"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$ZIPALIGN" -f -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/marko-aligned.apk"
          mkdir -p signed
          "$APK_SIGNER" sign --ks "$RUNNER_TEMP/marko.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_STORE_PASSWORD" --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out signed/super-marko-update-1300100.apk "$RUNNER_TEMP/marko-aligned.apk"
          "$APK_SIGNER" verify --verbose --print-certs signed/super-marko-update-1300100.apk
          "$AAPT" dump badging signed/super-marko-update-1300100.apk | grep "^package:"
          sha256sum signed/super-marko-update-1300100.apk
      - name: Upload RELEASE update APK
        if: env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_STORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: super-marko-signed-update-1300100
          path: signed/super-marko-update-1300100.apk
          retention-days: 30
