name: Customer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/customer-android-capacitor
      - codex/super-marko-capacitor
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/firebase/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/firebase/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android-build.yml'

concurrency:
  group: customer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VERSION_BASE: '1.2'
      APP_VERSION_CODE_BASE: '120165'
      CUSTOMER_FIREBASE_FALLBACK: 'config/firebase/google-services.customer.json'
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Detect Firebase client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] || [ -f "$CUSTOMER_FIREBASE_FALLBACK" ]; then
            echo "VITE_NATIVE_PUSH_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Firebase native push is enabled for this build."
          else
            echo "VITE_NATIVE_PUSH_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Firebase native push is disabled because no client config is available."
          fi

      - name: Restore stable debug signing when configured
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/customer-debug.keystore"
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/customer-debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test customer flows
        run: npm run test:customer

      - name: Typecheck
        run: npm run typecheck

      - name: Build React app
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure Firebase client
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase google-services.json configured from GitHub secret."
          elif [ -f "$CUSTOMER_FIREBASE_FALLBACK" ]; then
            cp "$CUSTOMER_FIREBASE_FALLBACK" android/app/google-services.json
            echo "Firebase google-services.json configured from the recovered customer app config."
          else
            echo "No Firebase client config is available; native FCM stays disabled in this APK."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Android version
        run: node scripts/set-android-version.mjs

      - name: Configure Play release support
        run: node scripts/prepare-play-release.mjs

      - name: Prepare Android permissions, brand and back behavior
        run: |
          node scripts/prepare-android.mjs
          node scripts/prepare-android-back.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/elmadawy-customer-build-${{ github.run_number }}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elmadawy-customer-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/elmadawy-customer-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14


      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/customer-debug.keystore"
