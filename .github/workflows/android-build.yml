name: Customer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/customer-android-capacitor
      - codex/super-marko-capacitor
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/firebase/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/firebase/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android-build.yml'

concurrency:
  group: customer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      APP_VERSION_BASE: '1.2'
      APP_VERSION_CODE_BASE: '120165'
      CUSTOMER_FIREBASE_FALLBACK: 'config/firebase/google-services.customer.json'
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old customer APK artifacts requested on 2026-10-04
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/super-marko-capacitor'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactIds = [11293864653,11293799457,11283635044,11282393387,10940222496,10913739811,10914527470,10913465849,10913049062,10841242759];
            let freed = 0;
            for (const artifact_id of artifactIds) {
              try {
                const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id });
                if (!artifact.name.startsWith('elmadawy-customer-')) throw new Error('Unexpected artifact name');
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id });
                freed += artifact.size_in_bytes;
                core.info('Deleted ' + artifact.name + ' (' + artifact.size_in_bytes + ' bytes)');
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info('Artifact ' + artifact_id + ' already removed');
              }
            }
            core.summary.addHeading('Requested APK cleanup').addRaw('Removed up to ' + artifactIds.length + ' old customer builds; freed ' + freed + ' bytes.').write();

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Detect Firebase client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] || [ -f "$CUSTOMER_FIREBASE_FALLBACK" ]; then
            echo "VITE_NATIVE_PUSH_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Firebase native push is enabled for this build."
          else
            echo "VITE_NATIVE_PUSH_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Firebase native push is disabled because no client config is available."
          fi

      - name: Restore stable debug signing when configured
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/customer-debug.keystore"
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/customer-debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test customer flows
        run: npm run test:customer

      - name: Typecheck
        run: npm run typecheck

      - name: Build React app
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure Firebase client
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase google-services.json configured from GitHub secret."
          elif [ -f "$CUSTOMER_FIREBASE_FALLBACK" ]; then
            cp "$CUSTOMER_FIREBASE_FALLBACK" android/app/google-services.json
            echo "Firebase google-services.json configured from the recovered customer app config."
          else
            echo "No Firebase client config is available; native FCM stays disabled in this APK."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Android version
        run: node scripts/set-android-version.mjs

      - name: Configure Play release support
        run: node scripts/prepare-play-release.mjs

      - name: Prepare Android permissions, brand and back behavior
        run: |
          node scripts/prepare-android.mjs
          node scripts/prepare-android-back.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/elmadawy-customer-build-${{ github.run_number }}.apk"

      - name: Upload debug APK
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: elmadawy-customer-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/elmadawy-customer-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14


      - name: Export APK when Actions artifact quota is unavailable
        if: steps.apk_artifact.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/codex/super-marko-capacitor'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = 'android/app/build/outputs/apk/debug/elmadawy-customer-build-' + context.runNumber + '.apk';
            const apk = fs.readFileSync(path);
            const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
            const versionName = gradle.match(/versionName[ ]+["']([^"']+)["']/)[1];
            const versionCode = Number(gradle.match(/versionCode[ ]+([0-9]+)/)[1]);
            const manifest = { filename: 'SuperMarko-' + versionName + '.apk', versionName, versionCode, size: apk.length, sha256: crypto.createHash('sha256').update(apk).digest('hex'), sourceCommit: context.sha, parts: [] };
            const tree = [];
            const partBytes = 262144;
            for (let offset = 0, index = 0; offset < apk.length; offset += partBytes, index++) {
              const file = 'apk-parts/part-' + String(index).padStart(3, '0') + '.b64';
              const data = apk.subarray(offset, offset + partBytes).toString('base64');
              const { data: blob } = await github.rest.git.createBlob({ ...context.repo, content: data, encoding: 'utf-8' });
              tree.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
              manifest.parts.push(file);
            }
            const { data: manifestBlob } = await github.rest.git.createBlob({ ...context.repo, content: JSON.stringify(manifest, null, 2), encoding: 'utf-8' });
            tree.push({ path: 'apk-manifest.json', mode: '100644', type: 'blob', sha: manifestBlob.sha });
            const { data: exportTree } = await github.rest.git.createTree({ ...context.repo, tree });
            const { data: exportCommit } = await github.rest.git.createCommit({ ...context.repo, message: 'Private APK download export ' + versionName, tree: exportTree.sha, parents: [] });
            const branch = 'build/customer-apk-' + context.runId;
            await github.rest.git.createRef({ ...context.repo, ref: 'refs/heads/' + branch, sha: exportCommit.sha });
            core.info('APK_EXPORT_BRANCH=' + branch);
            core.info('APK_EXPORT_SHA256=' + manifest.sha256);
            await core.summary.addHeading('APK download export').addRaw(manifest.filename + ' (' + manifest.size + ' bytes) is available on private branch ' + branch + '.').write();

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/customer-debug.keystore"
