name: Prepare Push Plugin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-push-plugin.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install compatible Capacitor Push plugin
        run: npm install @capacitor/push-notifications@latest-7 --save

      - name: Verify web build
        run: npm run build

      - name: Commit updated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "feat: install Capacitor push notifications [skip ci]"
          git push origin HEAD:main
