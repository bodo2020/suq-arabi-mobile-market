# Local Supabase configuration for Elmadawy Market.
project_id = "qzvpayjaadbmpayeglon"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://elmadawymarket.store",
  "https://elmadawymarket.store",
  "http://www.elmadawymarket.store",
  "https://www.elmadawymarket.store",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "capacitor://localhost"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

# Local Auth abuse protection. Production limits must also be configured in
# Supabase Dashboard > Authentication > Rate Limits.
[auth.rate_limit]
sms_sent = 3
sign_in_sign_ups = 30
token_verifications = 30

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your verification code is {{ .Code }}"

[analytics]
enabled = false
port = 54327
vector_port = 54328

[analytics.big_query]
project_id = ""
dataset_id = ""
key_file = ""
